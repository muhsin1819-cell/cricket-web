<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Buraimi Cars Cricket</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BCC Cricket">
<meta name="theme-color" content="#0e3a29">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
@font-face{font-family:"Barlow Condensed";font-weight:500;src:url(barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url(barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url(barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:400;src:url(figtree-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:500;src:url(figtree-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:600;src:url(figtree-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:700;src:url(figtree-latin-700-normal.woff2) format("woff2")}
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one phone-width column; a stadium-style scoreboard panel on top, thumb-reach keypad below */
:root{
  --bg:#edf2ee; --surface:#ffffff; --ink:#13201a; --muted:#5a6a61; --line:#d3ddd6; --chip:#e3ebe5;
  --pitch:#17694a; --pitch-ink:#ffffff;
  --board:#0e3a29; --board-ink:#ecf6ef; --board-dim:#a3c7b3;
  --ball:#b42318; --ball-ink:#ffffff; --ball-soft:#fbe8e5;
  --gold:#e0ac22; --gold-ink:#231a00;
  --f-score:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a110d; --surface:#121c16; --ink:#e3ece6; --muted:#8fa196; --line:#24342b; --chip:#1b2921;
  --pitch:#3db27b; --pitch-ink:#05140c; --board:#0f2b1f; --board-ink:#ecf6ef; --board-dim:#8cb39e;
  --ball:#ff6b5d; --ball-ink:#1e0402; --ball-soft:#3a1613; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a110d; --surface:#121c16; --ink:#e3ece6; --muted:#8fa196; --line:#24342b; --chip:#1b2921;
  --pitch:#3db27b; --pitch-ink:#05140c; --board:#0f2b1f; --board-ink:#ecf6ef; --board-dim:#8cb39e;
  --ball:#ff6b5d; --ball-ink:#1e0402; --ball-soft:#3a1613; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding-inline:max(16px, env(safe-area-inset-left, 0px));padding-top:calc(12px + env(safe-area-inset-top, 0px));padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:14px}
#app.inmatch{padding-bottom:24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
h1,h2{margin:0;text-wrap:balance}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font:600 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--pitch)}
.top h1{font:700 34px/1 var(--f-score)}
.sync{font-size:12px;color:var(--muted);text-align:right}
.mtop{display:flex;align-items:center;gap:8px}
.mtop h1{font:700 24px/1.05 var(--f-score);flex:1;min-width:0}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;height:40px;min-width:40px;padding:0 12px;font-weight:600}
.sec{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600}
.btn.primary{background:var(--pitch);color:var(--pitch-ink);border-color:var(--pitch)}
.btn.danger{background:var(--ball);color:var(--ball-ink);border-color:var(--ball)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mcard{all:unset;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.mcard:focus-visible{outline:2px solid var(--pitch)}
.mhead{display:flex;gap:8px;align-items:center;font-weight:700}
.mhead span:first-child{flex:1;min-width:0}
.mmeta{font-size:13px;color:var(--muted)}
.iline{display:flex;gap:8px;align-items:baseline}
.iline span{flex:1;min-width:0}
.iline b{font:700 20px var(--f-score);font-variant-numeric:tabular-nums}
.iline small{color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.mstatus{font-size:13px;font-weight:600;color:var(--pitch)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted)}
.tag.live{background:var(--ball);color:var(--ball-ink)}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.empty b{display:block;font:700 22px var(--f-score);color:var(--ink);margin-bottom:4px}

/* scoreboard */
.board{background:var(--board);color:var(--board-ink);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.board::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.035) 46px 92px);pointer-events:none}
.bteam{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:15px}
.bteam small{color:var(--board-dim);font-weight:500}
.bscore{font:700 72px/0.95 var(--f-score);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bscore span{color:var(--board-dim)}
.bline{display:flex;flex-wrap:wrap;gap:4px 16px;font:500 17px var(--f-score);color:var(--board-dim);font-variant-numeric:tabular-nums}
.bline b{color:var(--board-ink);font-weight:600}
.target{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.14);font:600 18px var(--f-score);font-variant-numeric:tabular-nums}

.players{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm i{font-style:normal;color:var(--pitch);margin-left:4px}
.prow .fig{font:600 19px var(--f-score);font-variant-numeric:tabular-nums}
.prow .fig small{font:500 14px var(--f-body);color:var(--muted)}
.prow .sub{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.over{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.over .lbl{margin-right:4px}
.bc{min-width:34px;height:34px;padding:0 7px;border-radius:99px;display:inline-grid;place-items:center;background:var(--chip);font:600 16px var(--f-score);font-variant-numeric:tabular-nums}
.bc.b4{background:var(--pitch);color:var(--pitch-ink)}
.bc.b6{background:var(--gold);color:var(--gold-ink)}
.bc.w{background:var(--ball);color:var(--ball-ink)}
.bc.x{background:transparent;border:1.5px dashed var(--muted);color:var(--ink)}

/* keypad */
.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.k{height:60px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font:700 28px var(--f-score);font-variant-numeric:tabular-nums;touch-action:manipulation}
.k:active{transform:scale(.97);background:var(--chip)}
.k.b4{background:var(--pitch);color:var(--pitch-ink);border-color:var(--pitch)}
.k.b6{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.k.t{font:600 15px var(--f-body)}
.k.wk{grid-column:span 4;background:var(--ball);color:var(--ball-ink);border-color:var(--ball);font:700 24px var(--f-score);letter-spacing:.08em;text-transform:uppercase}
.k.span2{grid-column:span 2}
.quiet{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.link{background:none;border:0;color:var(--muted);font-size:14px;font-weight:600;padding:8px 10px;text-decoration:underline;text-underline-offset:3px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel.alert{border-color:var(--ball);background:var(--ball-soft)}
.panel h2{font:700 22px/1.1 var(--f-score)}
.panel p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ch{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:baseline}
.ch small{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.ch.on{background:var(--pitch);color:var(--pitch-ink);border-color:var(--pitch)}
.ch.on small{color:inherit;opacity:.8}
.ch.num{min-width:48px;justify-content:center;font:700 20px var(--f-score)}
.actions{display:flex;gap:8px}
.actions .btn{flex:1}
.result{background:var(--board);color:var(--board-ink);border-radius:16px;padding:16px;font:700 26px/1.1 var(--f-score);text-align:center}

/* form */
.form{display:flex;flex-direction:column;gap:14px}
fieldset{margin:0}
legend{font:700 20px var(--f-score);padding:0 4px}
label{font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:120px}
.field{display:flex;flex-direction:column;gap:5px}
.row2{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
.hint{margin:0;font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{flex:1;text-align:center;padding:10px;font-size:15px;color:var(--ink);cursor:pointer}
.seg input:checked+label{background:var(--pitch);color:var(--pitch-ink)}
.seg input:focus-visible+label{outline:2px solid var(--pitch);outline-offset:-2px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}

/* tabs inside match */
.seg2{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px}
.seg2 button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;font-weight:600;color:var(--muted)}
.seg2 button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* tables */
.tw{overflow-x:auto;margin:0 -14px;padding:0 14px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0;white-space:normal}
td:first-child{min-width:130px}
td b{font-weight:700}
td .dis{display:block;font-size:12px;color:var(--muted)}
tr.tot td{border-bottom:0;font-weight:700}
.inhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.inhead h2{font:700 22px var(--f-score)}
.inhead span{font:700 22px var(--f-score);font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted);margin:0}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;max-width:240px;border:0;background:transparent;border-radius:10px;padding:10px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--pitch)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.k:active{transform:none}}
.backup{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.backup .actions .btn{font-size:14px}
.err{margin:0;color:var(--ball);font-weight:600;font-size:14px}
.dayhead{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.dayhead .link{padding:4px 0}
.row2b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tcount{display:flex;gap:16px;font-size:14px;color:var(--muted)}
.tcount b{color:var(--ink);font:700 18px var(--f-score)}
.assign{display:flex;flex-direction:column}
.arow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .nm{flex:1;min-width:0;font-weight:600}
.arow .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.ab{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ab button{border:0;background:var(--bg);width:46px;height:38px;font:700 18px var(--f-score)}
.ab button+button{border-left:1px solid var(--line)}
.ab button.on{background:var(--pitch);color:var(--pitch-ink)}
.card.list{padding:4px 14px;gap:0}
.mrow{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow:focus-visible{outline:2px solid var(--pitch)}
.mrow .nm{flex:1;min-width:0;font-weight:600}
.mrow .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center}
.tile b{font:700 26px/1 var(--f-score);font-variant-numeric:tabular-nums}
.tile span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.prof{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phone{font-variant-numeric:tabular-nums;font-weight:600;user-select:all}
.check{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink)}
.check input{width:20px;height:20px}
.link.inline{padding:0 4px;font-size:inherit}
td.rk{color:var(--muted);width:24px;padding-left:0}
th:first-child+th,td.rk+td{text-align:left;white-space:normal}
td.rk+td{min-width:110px}
td.rk{min-width:0}
.card.row{flex-direction:row;align-items:center;justify-content:space-between}
.card.row span{min-width:0}
.ovrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ovrow input{width:84px;flex:none}
.ovrow .ch.num{min-width:44px;padding:8px 10px;font-size:18px}
.capbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;width:40px;height:38px;font:700 16px var(--f-score);color:var(--muted)}
.capbtn.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.tcount i{font-style:normal;color:var(--ball)}
.av{width:38px;height:38px;border-radius:50%;flex:none;object-fit:cover;display:inline-grid;place-items:center;background:var(--chip);color:var(--pitch);font:700 15px var(--f-score);letter-spacing:.02em}
.av.big{width:64px;height:64px;font-size:24px}
.av.huge{width:96px;height:96px;font-size:34px}
.photorow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.photorow .btn{padding:9px 14px;font-size:14px;color:var(--ink);cursor:pointer}
.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.mom{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--gold);border-radius:16px;padding:12px 14px}
.momtx{display:flex;flex-direction:column;gap:2px;min-width:0}
.momtx b{font:700 24px/1.1 var(--f-score)}
.cmh{font:700 22px var(--f-score)}
.cmt{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cbody{min-width:0;flex:1}
.cmeta{font-size:13px;color:var(--muted)}
.cmeta b{color:var(--ink)}
.cbody p{margin:4px 0 0;overflow-wrap:anywhere}
.install{border-color:var(--pitch)}
.shareic{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 5px;font-size:13px}
.pdfbar{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom, 0px));max-width:488px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:5}
.pdfbar span{flex:1;font-weight:600}
.tabs{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.result small{display:block;font:500 15px var(--f-body);color:var(--board-dim);margin-top:6px}
</style>
</head>

<script id="engine">
/* Scoring engine: every match is a list of events per innings; all figures are derived by replaying them. */
var CE = (function(){
  var CREDIT = {'Bowled':1,'Caught':1,'LBW':1,'Stumped':1,'Hit wicket':1,'Run out':0};
  function ov(l){ return l % 6 ? Math.floor(l/6) + '.' + (l % 6) : String(l/6); }
  function dismiss(w, bowler){
    var f = w.f || '';
    switch (w.how) {
      case 'Bowled': return 'b ' + bowler;
      case 'Caught': return f && f === bowler ? 'c & b ' + bowler : (f ? 'c ' + f + ' b ' + bowler : 'caught b ' + bowler);
      case 'LBW': return 'lbw b ' + bowler;
      case 'Stumped': return 'st ' + (f ? f + ' ' : '') + 'b ' + bowler;
      case 'Hit wicket': return 'hit wicket b ' + bowler;
      case 'Run out': return 'run out' + (f ? ' (' + f + ')' : '');
      default: return w.how || 'out';
    }
  }
  function label(e){
    var x = e.x || '', r = e.r || 0, xr = e.xr || 0;
    if (e.w) return {t:'W', c:'w'};
    if (x === 'wd') return {t:(xr ? (1 + xr) : '') + 'wd', c:'x'};
    if (x === 'nb') return {t:'nb' + (r ? r : ''), c:'x'};
    if (x === 'b') return {t:xr + 'b', c:'x'};
    if (x === 'lb') return {t:xr + 'lb', c:'x'};
    return {t: r ? String(r) : '•', c: r === 4 ? 'b4' : r === 6 ? 'b6' : ''};
  }
  function replay(m, idx){
    var inn = m.innings[idx];
    var squad = m.teams[inn.bat].players;
    var st = {striker:null, non:null, bowler:null, prevBowler:null, legal:0, total:0, wkts:0,
      ext:{wd:0, nb:0, b:0, lb:0}, bat:{}, bowl:{}, field:{}, batOrder:[], bowlOrder:[], fow:[], over:[], overs:[],
      needBowler:true, overRuns:0, part:{r:0, b:0}, closed:false, opened:false};
    function B(n){ if (!st.bat[n]) { st.bat[n] = {name:n, r:0, b:0, f:0, s:0, out:null}; st.batOrder.push(n); } return st.bat[n]; }
    function W(n){ if (!st.bowl[n]) { st.bowl[n] = {name:n, balls:0, r:0, w:0, m:0, wd:0, nb:0}; st.bowlOrder.push(n); } return st.bowl[n]; }

      if (e.t === 'open') { st.opened = true; st.striker = e.s; st.non = e.n; B(e.s); B(e.n); st.bowler = e.bowl; W(e.bowl); st.needBowler = false; st.overRuns = 0; }

        else if (x === 'nb') { runs = 1 + r; st.ext.nb += 1; bt.r += r; bt.b += 1; bw.r += 1 + r; bw.nb += 1; run = r; if (r === 4) bt.f++; if (r === 6) bt.s++; }
        else if (x === 'b' || x === 'lb') { runs = xr; st.ext[x] += xr; bt.b += 1; run = xr; }
        else { runs = r; bt.r += r; bt.b += 1; bw.r += r; run = r; if (r === 4) bt.f++; if (r === 6) bt.s++; }
        st.total += runs;
        if (x !== 'b' && x !== 'lb') st.overRuns += runs;
        st.part.r += runs; if (x !== 'wd') st.part.b += 1;
        if (legal) { st.legal++; bw.balls++; }
        if (run % 2 === 1) swap();
        if (e.w) {
          var on = e.w.out || st.striker, ob = B(on);
          ob.out = dismiss(e.w, st.bowler);
          st.wkts++;
          if (CREDIT[e.w.how]) bw.w++;
          if (e.w.f && (e.w.how === 'Caught' || e.w.how === 'Stumped' || e.w.how === 'Run out')) {
            var fd = st.field[e.w.f] || (st.field[e.w.f] = {c:0, st:0, ro:0, dh:0});
            fd[e.w.how === 'Caught' ? 'c' : e.w.how === 'Stumped' ? 'st' : 'ro']++;
            if (e.w.how === 'Run out' && e.w.dh) fd.dh++;
          }
          st.fow.push({n:st.wkts, score:st.total, name:on, over:ov(st.legal)});
          if (on === st.striker) st.striker = null; else if (on === st.non) st.non = null;
          st.part = {r:0, b:0};
        }
        st.over.push(label(e));
        if (legal && st.legal % 6 === 0) {
          if (st.overRuns === 0) bw.m++;

          st.overs.push(st.over); st.over = [];
          st.prevBowler = st.bowler; st.bowler = null; st.needBowler = true; st.overRuns = 0;
        }

    });
    st.target = idx === 1 ? replay(m, 0).total + 1 : null;
    st.maxW = Math.max(1, squad.length - 1);
    st.maxBalls = m.overs * 6;
    st.done = st.closed || st.wkts >= st.maxW || st.legal >= st.maxBalls || (st.target != null && st.total >= st.target);
    st.vacant = st.opened ? (st.striker == null ? 's' : (st.non == null ? 'n' : null)) : null;
    st.extTotal = st.ext.wd + st.ext.nb + st.ext.b + st.ext.lb;
    return st;
  }
  function result(m){
    if (m.innings.length < 2) return null;
    var a = replay(m, 0), b = replay(m, 1);
    if (!b.done) return null;
    var ta = m.teams[m.innings[0].bat].name, tb = m.teams[m.innings[1].bat].name;
    if (b.total >= b.target) {
      var wl = b.maxW - b.wkts, bl = b.maxBalls - b.legal;
      return tb + ' won by ' + wl + ' wicket' + (wl === 1 ? '' : 's') + (bl > 0 ? ' (' + bl + ' ball' + (bl === 1 ? '' : 's') + ' left)' : '');
    }
    if (b.total === a.total) return 'Match tied';
    var d = a.total - b.total;
    return ta + ' won by ' + d + ' run' + (d === 1 ? '' : 's');
  }
  /* MVP points (club rules)
     Batting:  1 per run, +2 per four, +4 per six, -1 for a duck; +15 for 50 runs, or +40 for 100 runs (instead of the 50 bonus)
     Bowling:  10 per wicket, +5 per maiden; +10 for 3 wickets, or +15 for 5 wickets (instead of the 3-wicket bonus)
     Fielding: 8 per catch, 6 per stumping, 12 per direct-hit run out */
  var PTS = {run:1, four:2, six:4, duck:-1, fifty:15, hundred:40, wkt:10, maiden:5, w3:10, w5:15, catch:8, stump:6, direct:12};
  function batPoints(b){ return b.r * PTS.run + b.f * PTS.four + b.s * PTS.six + (b.out && b.r === 0 ? PTS.duck : 0) + (b.r >= 100 ? PTS.hundred : b.r >= 50 ? PTS.fifty : 0); }
  function bowlPoints(b){ return b.w * PTS.wkt + b.m * PTS.maiden + (b.w >= 5 ? PTS.w5 : b.w >= 3 ? PTS.w3 : 0); }
  function fieldPoints(f){ return f.c * PTS.catch + f.st * PTS.stump + (f.dh || 0) * PTS.direct; }
  function matchPoints(m){
    var key = function(n){ return (m.pids && m.pids[n]) || ('n:' + n); };
    var pts = {}, names = {}, parts = {};
    function add(n, kind, p){ var k = key(n); names[k] = n; pts[k] = (pts[k] || 0) + p; var q = parts[k] || (parts[k] = {bat:0, bowl:0, field:0}); q[kind] += p; }

      st.bowlOrder.forEach(function(n){ add(n, 'bowl', bowlPoints(st.bowl[n])); });

    }

  }
  /* Man of the Match: most points; ties go to the winning side, then more runs + wickets */
  function playerOfMatch(m){
    if (m.status !== 'done') return null;
    var mp = matchPoints(m), best = null, win = null;
    if (m.innings.length === 2) {
      var a = replay(m, 0), b = replay(m, 1);
      if (b.total >= b.target) win = m.teams[m.innings[1].bat]; else if (a.total > b.total) win = m.teams[m.innings[0].bat];
    }
    var onWin = function(k){ return win ? win.players.some(function(n){ return mp.key(n) === k; }) : false; };
    Object.keys(mp.pts).forEach(function(k){
      var c = {key:k, name:mp.names[k], pts:mp.pts[k], parts:mp.parts[k], win:onWin(k)};
      if (!best || c.pts > best.pts || (c.pts === best.pts && c.win && !best.win)) best = c;
    });
    return best;
  }
  function stats(list){
    var P = {};
    function G(k, n){ return P[k] || (P[k] = {key:k, name:n, m:0, inn:0, r:0, b:0, f:0, s:0, no:0, hs:-1, hsNo:false, fifty:0,
      binn:0, balls:0, rc:0, w:0, md:0, bw:-1, br:0, c:0, st:0, ro:0, dh:0, pts:0, pom:0}); }
    list.forEach(function(m){
      var mp = matchPoints(m), key = mp.key, seen = {};
      m.teams.forEach(function(t){ t.players.forEach(function(n){ var k = key(n); if (!seen[k]) { seen[k] = 1; G(k, n).m++; } }); });
      for (var i = 0; i < m.innings.length; i++) {
        var st = replay(m, i);
        st.batOrder.forEach(function(n){
          var b = st.bat[n], a = G(key(n), n);
          a.inn++; a.r += b.r; a.b += b.b; a.f += b.f; a.s += b.s;
          if (!b.out) a.no++;
          if (b.r >= 50) a.fifty++;
          if (b.r > a.hs || (b.r === a.hs && !b.out)) { a.hs = b.r; a.hsNo = !b.out; }
        });
        st.bowlOrder.forEach(function(n){
          var b = st.bowl[n], a = G(key(n), n);
          if (!b.balls && !b.r) return;
          a.binn++; a.balls += b.balls; a.rc += b.r; a.w += b.w; a.md += b.m;
          if (b.w > a.bw || (b.w === a.bw && b.r < a.br)) { a.bw = b.w; a.br = b.r; }
        });
        Object.keys(st.field).forEach(function(n){ var f = st.field[n], a = G(key(n), n); a.c += f.c; a.st += f.st; a.ro += f.ro; a.dh += (f.dh || 0); });
      }
      Object.keys(mp.pts).forEach(function(k){ G(k, mp.names[k]).pts += mp.pts[k]; });
      var pom = playerOfMatch(m); if (pom) G(pom.key, pom.name).pom++;
    });
    return Object.keys(P).map(function(k){ return P[k]; });
  }
  return {ov:ov, replay:replay, result:result, stats:stats, label:label, matchPoints:matchPoints, playerOfMatch:playerOfMatch, PTS:PTS};
})();

<script>

/* ---------- shared view parts ---------- */

function header(title, sub){

function inningsLine(m, i){

function liveStatus(m){
  var idx = m.innings.length - 1, st = CE.replay(m, idx), t = m.teams[m.innings[idx].bat].name;
  if (idx === 1 && st.opened) { var need = st.target - st.total, bl = st.maxBalls - st.legal; return t + ' need ' + need + ' from ' + plural(bl, 'ball'); }
  if (idx === 0 && st.done) return 'Innings break';
  if (!st.opened) return m.teams[m.toss.won].name + ' won the toss and chose to ' + m.toss.chose;
  return t + ' batting';
}
function card(m){
  var status = m.status === 'done' ? (m.result || 'Completed') : liveStatus(m);
  var pom = CE.playerOfMatch(m);
  return '<button class="mcard" data-act="open" data-id="' + esc(m.id) + '">' +
    '<div class="mhead"><span>' + esc(m.teams[0].name) + ' vs ' + esc(m.teams[1].name) + '</span>' +
    (m.status !== 'done' ? '<span class="tag live">Live</span>' : '') + '</div>' +
    '<div class="mmeta">' + m.overs + (m.overs === 1 ? ' over' : ' overs') + (m.venue ? ' · ' + esc(m.venue) : '') +
    (m.status !== 'done' && m.scorer ? ' · scoring: ' + esc(m.scorer.name) : '') + '</div>' +
    (m.teams[0].captain || m.teams[1].captain ? '<div class="mmeta">Captains: ' + m.teams.map(function(t){ return esc(t.captain || '–'); }).join(' & ') + '</div>' : '') +
    m.innings.map(function(_, i){ return inningsLine(m, i); }).join('') +
    '<div class="mstatus">' + esc(status) + '</div>' +
    (pom ? '<div class="mmeta">Man of the Match: <b>' + esc(displayName(pom.key, pom.name)) + '</b> (' + pom.pts + ' pts)</div>' : '') + '</button>';
}

/* ---------- matches ---------- */
function home(){
  var list = listMatches().sort(function(a, b){ return (b.date || 0) - (a.date || 0); });
  var live = list.filter(function(m){ return m.status !== 'done'; }), done = list.filter(function(m){ return m.status === 'done'; });
  var h = header('Matches', esc(me.name));
  h += '<button class="btn primary block" data-act="new">+ New match</button>';
  if (!loaded.m) return h + '<div class="empty"><b>Loading matches…</b>First load needs internet.</div>';
  var today = list.filter(function(m){ return dayKey(m.date) === dayKey(Date.now()); });
  if (today.length) h += '<div class="actions"><button class="btn" data-act="daypdf" data-v="' + dayKey(Date.now()) + '">Today’s scorecards PDF</button><button class="btn" data-act="shareday" data-v="' + dayKey(Date.now()) + '">Today’s results text</button></div>';
  if (!list.length) h += '<div class="empty"><b>No matches yet</b>Add your members first, then tap New match, pick who is playing and split the teams.</div>';
  if (live.length) h += '<h2 class="sec">Live</h2>' + live.map(card).join('');
  var lastDay = '';
  done.forEach(function(m){
    var k = dayKey(m.date);
    if (k !== lastDay) { h += '<div class="dayhead"><h2 class="sec">' + fmtDate(m.date, true) + '</h2><span><button class="link" data-act="daypdf" data-v="' + k + '">PDF</button><button class="link" data-act="shareday" data-v="' + k + '">Text</button></span></div>'; lastDay = k; }
    h += card(m);
  });
  var del = Object.keys(matches).filter(function(k){ return matches[k].deleted; });
  if (del.length) {
    h += '<div class="quiet"><button class="link" data-act="showdel">' + (ui.showDel ? 'Hide' : 'Show') + ' deleted matches (' + del.length + ')</button></div>';
    if (ui.showDel) h += del.map(function(k){ var m = matches[k]; return '<div class="card row"><span>' + esc(m.teams[0].name) + ' vs ' + esc(m.teams[1].name) + ' · ' + fmtDate(m.date) + '</span><button class="btn" data-act="restore" data-id="' + esc(k) + '">Restore</button></div>'; }).join('');
  }
  return h;
}

/* ---------- new match: pick players and teams ---------- */
function newDraft(){
  var last = listMatches().sort(function(a, b){ return (b.date || 0) - (a.date || 0); })[0];
  return {names:['Team A', 'Team B'], overs:25, venue: last ? (last.venue || '') : '', toss:0, chose:'bat', team:{}, cap:{}};
}
function capLabel(t){ var id = draft.cap[t]; return id && players[id] ? ' · captain ' + esc(players[id].name) : ' · <i>no captain yet</i>'; }
function fixCaps(){ ['A', 'B'].forEach(function(t){ var id = draft.cap[t]; if (id && draft.team[id] !== t) delete draft.cap[t]; }); }
function teamCount(t){ var n = 0; for (var k in draft.team) if (draft.team[k] === t) n++; return n; }

    '<div class="field"><label for="dov">Overs per side</label><div class="ovrow"><input id="dov" type="number" inputmode="numeric" min="1" max="50" value="' + d.overs + '">' +

    '<div class="field"><label for="dvn">Ground</label><input id="dvn" maxlength="60" value="' + esc(d.venue) + '"></div></fieldset>';
  h += '<fieldset class="card"><legend>Who’s playing today?</legend>';

    ps.map(function(p){ return '<button type="button" class="ch' + (d.team[p.id] ? ' on' : '') + '" data-act="pick" data-id="' + esc(p.id) + '" data-name="' + esc(p.name.toLowerCase()) + '">' + esc(p.name) + ' <small>' + (ROLE_SHORT[p.role] || '') + '</small></button>'; }).join('') + '</div>';

  h += '<p class="small">' + plural(sel.length, 'player') + ' selected</p></fieldset>';
  if (sel.length) {
    h += '<fieldset class="card"><legend>Teams</legend><button type="button" class="btn block" data-act="autosplit">Split teams automatically</button>' +
      '<p class="small">Spreads keepers, bowlers and all-rounders evenly, then fills with batters. Tap A or B to move anyone, and tap C to make someone captain.</p>' +
      '<div class="tcount"><span>' + esc(d.names[0] || 'Team 1') + ': <b>' + teamCount('A') + '</b>' + capLabel('A') + '</span><span>' + esc(d.names[1] || 'Team 2') + ': <b>' + teamCount('B') + '</b>' + capLabel('B') + '</span></div>' +
      '<div class="assign">' + sel.map(function(p){
        return '<div class="arow"><span class="nm">' + esc(p.name) + ' <small>' + esc(p.role || '') + '</small></span><span class="ab">' +
          '<button type="button" class="' + (d.team[p.id] === 'A' ? 'on' : '') + '" data-act="assign" data-id="' + esc(p.id) + '" data-v="A">A</button>' +
          '<button type="button" class="' + (d.team[p.id] === 'B' ? 'on' : '') + '" data-act="assign" data-id="' + esc(p.id) + '" data-v="B">B</button></span>' +
          '<button type="button" class="capbtn' + (d.cap[d.team[p.id]] === p.id ? ' on' : '') + '" data-act="cap" data-id="' + esc(p.id) + '" aria-label="Make ' + esc(p.name) + ' captain">C</button></div>';
      }).join('') + '</div></fieldset>';
  }
  h += '<fieldset class="card"><legend>Toss</legend><div class="field"><label for="dtw">Won by</label><select id="dtw"><option value="0"' + (d.toss === 0 ? ' selected' : '') + '>' + esc(d.names[0] || 'Team 1') + '</option><option value="1"' + (d.toss === 1 ? ' selected' : '') + '>' + esc(d.names[1] || 'Team 2') + '</option></select></div>' +
    '<div class="field"><label>Chose to</label><div class="seg"><input type="radio" name="del" id="del-bat" value="bat"' + (d.chose === 'bat' ? ' checked' : '') + '><label for="del-bat">Bat first</label><input type="radio" name="del" id="del-bowl" value="bowl"' + (d.chose === 'bowl' ? ' checked' : '') + '><label for="del-bowl">Bowl first</label></div></div></fieldset>';
  h += '<button class="btn primary block" type="submit">Start match</button></form>';
  return h;
}
function autoSplit(){
  var ids = Object.keys(draft.team).filter(function(k){ return draft.team[k]; });
  var order = ['Wicket-keeper', 'Bowler', 'All-rounder', 'Batter'];
  var groups = order.map(function(r){ return ids.filter(function(id){ return (players[id] && players[id].role || 'All-rounder') === r; }); });
  var rest = ids.filter(function(id){ return order.indexOf(players[id] && players[id].role) < 0; });
  groups[2] = groups[2].concat(rest);
  var a = 0, b = 0;
  groups.forEach(function(g){
    for (var i = g.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = g[i]; g[i] = g[j]; g[j] = t; }
    g.forEach(function(id){ var to = a < b ? 'A' : b < a ? 'B' : (Math.random() < .5 ? 'A' : 'B'); draft.team[id] = to; if (to === 'A') a++; else b++; });
  });
}

/* ---------- live match ---------- */
function scoreboard(m, idx, st){
  var inn = m.innings[idx], bt = m.teams[inn.bat];
  var h = '<section class="board" aria-label="Scoreboard"><div class="bteam"><span>' + esc(bt.name) + '</span><small>' + (idx === 0 ? '1st' : '2nd') + ' innings</small></div>' +
    '<div class="bscore">' + st.total + '<span>/' + st.wkts + '</span></div>' +
    '<div class="bline"><span>Overs <b>' + CE.ov(st.legal) + '</b> / ' + m.overs + '</span><span>Run rate <b>' + rate(st.total, st.legal) + '</b></span><span>Extras <b>' + st.extTotal + '</b></span></div>';
  if (st.target != null) {
    var need = Math.max(0, st.target - st.total), bl = st.maxBalls - st.legal;
    h += '<div class="target">Target ' + st.target + ' · ' + (need > 0 ? 'Need ' + need + ' from ' + plural(bl, 'ball') + (bl > 0 ? ' · Req. ' + rate(need, bl) : '') : 'Target reached') + '</div>';
  }
  return h + '</section>';
}
function playersCard(st){
  if (!st.opened) return '';
  var h = '<section class="card players"><div class="lbl">Batting</div>';
  [st.striker, st.non].forEach(function(n, i){
    if (n == null) return;
    var b = st.bat[n];
    h += '<div class="prow"><span class="nm">' + esc(n) + (i === 0 ? '<i aria-label="on strike">●</i>' : '') + '</span><span class="fig">' + b.r + ' <small>(' + b.b + ')</small></span>' +
      '<span class="sub">4s ' + b.f + ' · 6s ' + b.s + ' · SR ' + sr(b.r, b.b) + '</span></div>';
  });
  if (st.striker != null && st.non != null) h += '<div class="small">Partnership ' + st.part.r + ' (' + st.part.b + ')</div>';
  var bn = st.bowler || st.prevBowler;
  if (bn) {
    var w = st.bowl[bn];
    h += '<div class="lbl" style="margin-top:6px">Bowling</div><div class="prow"><span class="nm">' + esc(bn) + '</span><span class="fig">' + w.w + '-' + w.r + ' <small>(' + CE.ov(w.balls) + ')</small></span>' +
      '<span class="sub">Maidens ' + w.m + ' · Econ ' + rate(w.r, w.balls) + (w.wd || w.nb ? ' · wd ' + w.wd + ' nb ' + w.nb : '') + '</span></div>';
  }
  h += '</section>';
  var balls = st.over.length ? st.over : (st.overs.length ? st.overs[st.overs.length - 1] : []);
  if (balls.length) h += '<div class="over"><span class="lbl">' + (st.over.length ? 'This over' : 'Last over') + '</span>' + balls.map(function(b){ return '<span class="bc ' + b.c + '">' + esc(b.t) + '</span>'; }).join('') + '</div>';
  return h;
}
function addPlayerRow(t, role){
  return '<div class="addrow"><input id="addp" placeholder="Someone else? Type a name" maxlength="40" aria-label="Player name"><button class="btn" data-act="addp" data-t="' + t + '" data-role="' + role + '">Add</button></div>';
}
function momCard(m){
  var pom = CE.playerOfMatch(m); if (!pom) return '';
  var b = pom.parts || {bat:0, bowl:0, field:0};
  return '<section class="mom">' + avatar(pom.key, pom.name, 'big') + '<div class="momtx"><span class="lbl">🏆 Man of the Match</span><b>' + esc(displayName(pom.key, pom.name)) + '</b>' +
    '<span class="small">' + pom.pts + ' pts · batting ' + b.bat + ' · bowling ' + b.bowl + ' · fielding ' + b.field + '</span></div></section>';
}
function controls(m, idx, st){
  var inn = m.innings[idx], batT = m.teams[inn.bat], bowlT = m.teams[1 - inn.bat];
  var mine = m.scorer && m.scorer.uid === me.uid;
  var undo = '<button class="btn" data-act="undo">Undo last</button>';
  if (m.status === 'done') {
    var pom = CE.playerOfMatch(m);
    return '<div class="result">' + esc(m.result || 'Match complete') + '</div>' + momCard(m) +
      '<div class="actions"><button class="btn primary" data-act="sharepdf">Share PDF</button><button class="btn" data-act="share">Share as text</button></div>' +
      '<div class="actions">' + (mine ? undo : '<button class="btn" data-act="claim">Fix a mistake</button>') + '</div>';
  }
  if (!mine) {
    return m.scorer
      ? '<div class="panel"><h2>' + esc(m.scorer.name) + ' is scoring</h2><p>The score updates here live. If they have stopped, you can carry on from where they left off.</p><button class="btn" data-act="claim">Take over scoring</button></div>'
      : '<button class="btn primary block" data-act="claim">Score this match</button>';
  }
  var stop = '<div class="quiet"><button class="link" data-act="chov">Change overs</button><button class="link" data-act="release">Stop scoring on this phone</button></div>';
  if (ui.chov) {
    var minOv = Math.max(1, Math.ceil(m.innings.reduce(function(a, _, i){ return Math.max(a, CE.replay(m, i).legal); }, 0) / 6));
    return '<div class="panel"><h2>Change overs per side</h2><p>Currently ' + m.overs + ' overs. Use this when the match is shortened or extended. It can’t be less than ' + minOv + ' (overs already bowled).</p>' +
      '<div class="ovrow"><input id="chov" type="number" inputmode="numeric" min="' + minOv + '" max="50" value="' + m.overs + '" aria-label="Overs per side">' +
      [10, 15, 20, 25, 30].filter(function(o){ return o >= minOv; }).map(function(o){ return '<button type="button" class="ch num" data-act="chovset" data-v="' + o + '">' + o + '</button>'; }).join('') + '</div>' +
      '<div class="actions"><button class="btn primary" data-act="chovok" data-min="' + minOv + '">Save overs</button><button class="btn" data-act="cancel">Cancel</button></div></div>';
  }
  if (ui.confirmEnd) return '<div class="panel alert"><h2>End this innings now?</h2><p>Use this for a declaration, rain or a shortened game. You can undo it.</p><div class="actions"><button class="btn danger" data-act="endok">End innings</button><button class="btn" data-act="cancel">Keep scoring</button></div></div>';
  if (st.done && idx === 0) {
    return '<div class="panel"><h2>Innings complete</h2><p>' + esc(batT.name) + ' scored ' + st.total + '/' + st.wkts + ' in ' + CE.ov(st.legal) + ' overs. ' + esc(bowlT.name) + ' need ' + (st.total + 1) + ' to win.</p>' +
      '<div class="actions"><button class="btn primary" data-act="second">Start 2nd innings</button>' + undo + '</div></div>' + stop;
  }
  if (!st.opened) {
    var sel = function(id, list, pick){ return '<select id="' + id + '">' + list.map(function(p, i){ return '<option value="' + esc(p) + '"' + (i === pick ? ' selected' : '') + '>' + esc(p) + '</option>'; }).join('') + '</select>'; };
    return '<div class="panel"><h2>Start ' + (idx === 0 ? '1st' : '2nd') + ' innings</h2><p>' + esc(batT.name) + ' bat, ' + esc(bowlT.name) + ' bowl.</p>' +
      '<div class="field"><label for="op-s">Striker</label>' + sel('op-s', batT.players, 0) + '</div>' +
      '<div class="field"><label for="op-n">Non-striker</label>' + sel('op-n', batT.players, 1) + '</div>' +
      '<div class="field"><label for="op-b">Opening bowler</label>' + sel('op-b', bowlT.players, bowlT.players.length - 1) + '</div>' +
      '<button class="btn primary block" data-act="openinn">Start scoring</button>' + (idx > 0 ? undo : '') + '</div>' + stop;
  }
  if (st.vacant) {
    var avail = batT.players.filter(function(p){ return !st.bat[p]; });
    var back = batT.players.filter(function(p){ return st.bat[p] && st.bat[p].retired && p !== st.striker && p !== st.non; });
    return '<div class="panel"><h2>Next batter</h2><p>' + (avail.length || back.length ? 'Tap who walks in.' : 'No one left on the list. Add a name or end the innings.') + '</p><div class="chips">' +
      avail.map(function(p){ return '<button class="ch" data-act="bat" data-v="' + esc(p) + '">' + esc(p) + '</button>'; }).join('') + '</div>' +
      (back.length ? '<div class="lbl">Retired not out, can come back</div><div class="chips">' + back.map(function(p){ var b = st.bat[p]; return '<button class="ch" data-act="bat" data-v="' + esc(p) + '">' + esc(p) + ' <small>' + b.r + '* (' + b.b + ')</small></button>'; }).join('') + '</div>' : '') +
      addPlayerRow(inn.bat, 'bat') + '<div class="actions">' + undo + '<button class="btn" data-act="endinn">End innings</button></div></div>';
  }
  if (st.needBowler) {
    var list = bowlT.players.filter(function(p){ return p !== st.prevBowler; });
    return '<div class="panel"><h2>Over ' + (Math.floor(st.legal / 6) + 1) + ': who bowls?</h2><div class="chips">' +
      list.map(function(p){ var w = st.bowl[p]; return '<button class="ch" data-act="bowl" data-v="' + esc(p) + '">' + esc(p) + (w ? ' <small>' + CE.ov(w.balls) + '-' + w.m + '-' + w.r + '-' + w.w + '</small>' : '') + '</button>'; }).join('') + '</div>' +
      addPlayerRow(1 - inn.bat, 'bowl') + '<div class="actions">' + undo + '</div></div>';
  }
  if (ui.retire) {
    var rw = ui.retire.who;
    return '<div class="panel"><h2>Retire not out</h2><p>The batter leaves without being out and can come back to bat later in this innings. No ball is counted.</p><div class="chips">' +
      [st.striker, st.non].map(function(p){ var b = st.bat[p]; return '<button class="ch' + (rw === p ? ' on' : '') + '" data-act="retwho" data-v="' + esc(p) + '">' + esc(p) + ' <small>' + b.r + ' (' + b.b + ')</small></button>'; }).join('') +
      '</div><div class="actions"><button class="btn primary" data-act="retok">Retire ' + esc(rw) + '</button><button class="btn" data-act="cancel">Cancel</button></div></div>';
  }
  if (ui.wk) return wicketPanel(st, bowlT);
  if (ui.mode) {
    var titles = {wd:'Wide: extra runs taken', nb:'No ball: runs off the bat', b:'Byes: runs taken', lb:'Leg byes: runs taken'};
    var opts = ui.mode === 'wd' ? [0, 1, 2, 3, 4] : ui.mode === 'nb' ? [0, 1, 2, 3, 4, 6] : [1, 2, 3, 4];
    var note = ui.mode === 'wd' ? 'One run is added for the wide.' : ui.mode === 'nb' ? 'One run is added for the no ball; bat runs go to the batter.' : 'Runs go to extras, the ball counts.';
    return '<div class="panel"><h2>' + titles[ui.mode] + '</h2><p>' + note + '</p><div class="chips">' +
      opts.map(function(n){ return '<button class="ch num" data-act="ext" data-v="' + n + '">' + n + '</button>'; }).join('') + '</div><button class="btn" data-act="cancel">Cancel</button></div>';
  }
  return '<div class="pad" role="group" aria-label="Score this ball">' +
    '<button class="k" data-act="run" data-v="0" aria-label="Dot ball">0</button><button class="k" data-act="run" data-v="1">1</button><button class="k" data-act="run" data-v="2">2</button><button class="k" data-act="run" data-v="3">3</button>' +
    '<button class="k b4" data-act="run" data-v="4">4</button><button class="k b6" data-act="run" data-v="6">6</button>' +
    '<button class="k t" data-act="mode" data-v="wd">Wide</button><button class="k t" data-act="mode" data-v="nb">No ball</button>' +
    '<button class="k t" data-act="mode" data-v="b">Bye</button><button class="k t" data-act="mode" data-v="lb">Leg bye</button>' +

function scorecardText(m){

  m.innings.forEach(function(inn, i){
    var st = CE.replay(m, i), t = m.teams[inn.bat];
    lines.push('*' + t.name + ' ' + st.total + '/' + st.wkts + '* (' + CE.ov(st.legal) + ' ov)');
    st.batOrder.forEach(function(n){ var b = st.bat[n]; lines.push(n + (t.captain === n ? ' (c)' : '') + ' ' + b.r + (b.out ? '' : '*') + ' (' + b.b + ')' + (b.out ? ' – ' + b.out : b.retired ? ' – retired not out' : '')); });
    lines.push('Extras ' + st.extTotal);

  });

}
function dayText(k){
  var list = listMatches().filter(function(m){ return dayKey(m.date) === k; }).sort(function(a, b){ return a.date - b.date; });
  if (!list.length) return '';
  var lines = ['*🏏 Cricket – ' + fmtDate(list[0].date, true) + '*', ''];
  list.forEach(function(m, n){
    lines.push('*Match ' + (n + 1) + ':* ' + m.innings.map(function(inn, i){ var st = CE.replay(m, i); return m.teams[inn.bat].name + ' ' + st.total + '/' + st.wkts + ' (' + CE.ov(st.legal) + ')'; }).join(' vs '));
    lines.push(m.status === 'done' ? (m.result || '') : 'In progress: ' + liveStatus(m));
    var pom = CE.playerOfMatch(m); if (pom) lines.push('Man of the Match: ' + displayName(pom.key, pom.name));
    lines.push('');
  });
  var rows = CE.stats(list).map(function(r){ r.name = displayName(r.key, r.name); return r; });
  var top = function(f, n, fmt){ return rows.filter(function(r){ return r[f] > 0; }).sort(function(a, b){ return b[f] - a[f]; }).slice(0, n).map(fmt).join(', '); };

}

      addEvent(ev); return;
    case 'cancel': ui.mode = null; ui.wk = null; ui.confirmDel = false; ui.confirmEnd = false; ui.renaming = false; ui.retire = null; ui.chov = false; render(); return;
    case 'endinn': ui.confirmEnd = true; render(); return;
    case 'endok': addEvent({t:'end'}); return;
    case 'second': m.innings.push({bat:1 - m.innings[0].bat, events:[]}); afterChange(m); window.scrollTo(0, 0); return;
    case 'openinn':
      var s = $('#op-s').value, nn2 = $('#op-n').value, bw = $('#op-b').value;
      if (s === nn2) { toast('Pick two different batters'); return; }
      addEvent({t:'open', s:s, n:nn2, bowl:bw}); return;
    case 'bat': addEvent({t:'in', name:d.v}); return;
    case 'bowl': addEvent({t:'bowl', name:d.v}); return;
    case 'addp':
      var input = $('#addp'), name = input ? input.value.trim().replace(/\s+/g, ' ') : '', team = m.teams[+d.t];
      if (!name) { toast('Type a name first'); return; }
      var known = playerByName(name); if (known) name = known.name;
      if (d.role === 'bat' && st.bat[name]) { toast(name + ' has already batted'); return; }
      if (d.role === 'bowl' && name === st.prevBowler) { toast(name + ' bowled the last over'); return; }
      if (team.players.indexOf(name) < 0) team.players.push(name);
      linkPlayer(m, name);
      addEvent(d.role === 'bat' ? {t:'in', name:name} : {t:'bowl', name:name}); return;
    case 'del': ui.confirmDel = true; render(); return;
    case 'delok': m.deleted = true; saveMatch(m); curId = null; go('home'); toast('Match deleted'); return;
  }
}

/* phone back button (Android) */
window.handleBack = function(){
  if (ui.wk || ui.mode || ui.confirmEnd || ui.confirmDel || ui.renaming || ui.retire || ui.chov) { act('cancel', {}); return true; }
  if (view === 'match' && tab === 'card') { tab = 'score'; render(); return true; }
  if (view === 'editMember') { go(editId ? 'profile' : 'members'); return true; }
  if (view === 'profile') { go('members'); return true; }
  if (view === 'new' || view === 'match' || view === 'members' || view === 'stats') { go('home'); return true; }
  return false;
};

var pg = $('#pdfgo'); if (pg) pg.addEventListener('click', function(){ if (pendingPdf) sharePdfFile(pendingPdf); });
var px = $('#pdfx'); if (px) px.addEventListener('click', hidePdfBar);
boot();
})();
</script>
