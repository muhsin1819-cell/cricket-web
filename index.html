<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Buraimi Cars Cricket</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BCC Cricket">
<meta name="theme-color" content="#0e2a52">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
@font-face{font-family:"Barlow Condensed";font-weight:500;src:url(barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url(barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url(barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:400;src:url(figtree-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:500;src:url(figtree-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:600;src:url(figtree-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:700;src:url(figtree-latin-700-normal.woff2) format("woff2")}
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one phone-width column; a stadium-style scoreboard panel on top, thumb-reach keypad below */
:root{
  --bg:#edf2f9; --surface:#ffffff; --ink:#0f1b2e; --muted:#566479; --line:#d4dcea; --chip:#e2e9f5;
  --pitch:#1d5bbf; --pitch-ink:#ffffff;
  --board:#0e2a52; --board-ink:#eef4fd; --board-dim:#a8bedf;
  --ball:#b42318; --ball-ink:#ffffff; --ball-soft:#fbe8e5;
  --gold:#e0ac22; --gold-ink:#231a00; --t1:#d8433a; --t2:#0f9d8a;
  --f-score:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08101e; --surface:#101b2e; --ink:#e3eaf5; --muted:#91a0b7; --line:#22324c; --chip:#19263d;
  --pitch:#5b9cf2; --pitch-ink:#04122a; --board:#0f2648; --board-ink:#eef4fd; --board-dim:#8fa8cf;
  --ball:#ff6b5d; --ball-ink:#1e0402; --ball-soft:#3a1613; --t1:#ff6b5d; --t2:#3cc7b2; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#08101e; --surface:#101b2e; --ink:#e3eaf5; --muted:#91a0b7; --line:#22324c; --chip:#19263d;
  --pitch:#5b9cf2; --pitch-ink:#04122a; --board:#0f2648; --board-ink:#eef4fd; --board-dim:#8fa8cf;
  --ball:#ff6b5d; --ball-ink:#1e0402; --ball-soft:#3a1613; --t1:#ff6b5d; --t2:#3cc7b2; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding-inline:max(16px, env(safe-area-inset-left, 0px));padding-top:calc(12px + env(safe-area-inset-top, 0px));padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:14px}
#app.inmatch{padding-bottom:24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
h1,h2{margin:0;text-wrap:balance}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font:600 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--pitch)}
.top h1{font:700 34px/1 var(--f-score)}
.sync{font-size:12px;color:var(--muted);text-align:right}
.mtop{display:flex;align-items:center;gap:8px}
.mtop h1{font:700 24px/1.05 var(--f-score);flex:1;min-width:0}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;height:40px;min-width:40px;padding:0 12px;font-weight:600}
.sec{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600}
.btn.primary{background:var(--pitch);color:var(--pitch-ink);border-color:var(--pitch)}
.btn.danger{background:var(--ball);color:var(--ball-ink);border-color:var(--ball)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mcard{all:unset;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.mcard:focus-visible{outline:2px solid var(--pitch)}
.mhead{display:flex;gap:8px;align-items:center;font-weight:700}
.mhead span:first-child{flex:1;min-width:0}
.mmeta{font-size:13px;color:var(--muted)}
.iline{display:flex;gap:8px;align-items:baseline}
.iline span{flex:1;min-width:0}
.iline b{font:700 20px var(--f-score);font-variant-numeric:tabular-nums}
.iline small{color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.mstatus{font-size:13px;font-weight:600;color:var(--pitch)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted)}
.tag.live{background:var(--ball);color:var(--ball-ink)}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.empty b{display:block;font:700 22px var(--f-score);color:var(--ink);margin-bottom:4px}

/* scoreboard */
.board{background:var(--board);color:var(--board-ink);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.board::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.035) 46px 92px);pointer-events:none}
.bteam{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:15px}
.bteam small{color:var(--board-dim);font-weight:500}
.bscore{font:700 72px/0.95 var(--f-score);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bscore span{color:var(--board-dim)}
.bline{display:flex;flex-wrap:wrap;gap:4px 16px;font:500 17px var(--f-score);color:var(--board-dim);font-variant-numeric:tabular-nums}
.bline b{color:var(--board-ink);font-weight:600}
.target{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.14);font:600 18px var(--f-score);font-variant-numeric:tabular-nums}

.players{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm i{font-style:normal;color:var(--pitch);margin-left:4px}
.prow .fig{font:600 19px var(--f-score);font-variant-numeric:tabular-nums}
.prow .fig small{font:500 14px var(--f-body);color:var(--muted)}
.prow .sub{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.over{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.over .lbl{margin-right:4px}
.bc{min-width:34px;height:34px;padding:0 7px;border-radius:99px;display:inline-grid;place-items:center;background:var(--chip);font:600 16px var(--f-score);font-variant-numeric:tabular-nums}
.bc.b4{background:var(--pitch);color:var(--pitch-ink)}
.bc.b6{background:var(--gold);color:var(--gold-ink)}
.bc.w{background:var(--ball);color:var(--ball-ink)}
.bc.x{background:transparent;border:1.5px dashed var(--muted);color:var(--ink)}

/* keypad */
.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.k{height:60px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font:700 28px var(--f-score);font-variant-numeric:tabular-nums;touch-action:manipulation}
.k:active{transform:scale(.97);background:var(--chip)}
.k.b4{background:var(--pitch);color:var(--pitch-ink);border-color:var(--pitch)}
.k.b6{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.k.t{font:600 15px var(--f-body)}
.k.wk{grid-column:span 4;background:var(--ball);color:var(--ball-ink);border-color:var(--ball);font:700 24px var(--f-score);letter-spacing:.08em;text-transform:uppercase}
.k.span2{grid-column:span 2}
.quiet{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.link{background:none;border:0;color:var(--muted);font-size:14px;font-weight:600;padding:8px 10px;text-decoration:underline;text-underline-offset:3px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel.alert{border-color:var(--ball);background:var(--ball-soft)}
.panel h2{font:700 22px/1.1 var(--f-score)}
.panel p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ch{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:baseline}
.ch small{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.ch.on{background:var(--pitch);color:var(--pitch-ink);border-color:var(--pitch)}
.ch.on small{color:inherit;opacity:.8}
.ch.num{min-width:48px;justify-content:center;font:700 20px var(--f-score)}
.actions{display:flex;gap:8px}
.actions .btn{flex:1}
.result{background:var(--board);color:var(--board-ink);border-radius:16px;padding:16px;font:700 26px/1.1 var(--f-score);text-align:center}

/* form */
.form{display:flex;flex-direction:column;gap:14px}
fieldset{margin:0}
legend{font:700 20px var(--f-score);padding:0 4px}
label{font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:120px}
.field{display:flex;flex-direction:column;gap:5px}
.row2{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
.hint{margin:0;font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{flex:1;text-align:center;padding:10px;font-size:15px;color:var(--ink);cursor:pointer}
.seg input:checked+label{background:var(--pitch);color:var(--pitch-ink)}
.seg input:focus-visible+label{outline:2px solid var(--pitch);outline-offset:-2px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}

/* tabs inside match */
.seg2{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px}
.seg2 button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;font-weight:600;color:var(--muted)}
.seg2 button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* tables */
.tw{overflow-x:auto;margin:0 -14px;padding:0 14px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0;white-space:normal}
td:first-child{min-width:130px}
td b{font-weight:700}
td .dis{display:block;font-size:12px;color:var(--muted)}
tr.tot td{border-bottom:0;font-weight:700}
.inhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.inhead h2{font:700 22px var(--f-score)}
.inhead span{font:700 22px var(--f-score);font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted);margin:0}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;max-width:240px;border:0;background:transparent;border-radius:10px;padding:10px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--pitch)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.k:active{transform:none}}
.backup{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.backup .actions .btn{font-size:14px}
.err{margin:0;color:var(--ball);font-weight:600;font-size:14px}
.dayhead{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.dayhead .link{padding:4px 0}
.row2b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tcount{display:flex;gap:16px;font-size:14px;color:var(--muted)}
.tcount b{color:var(--ink);font:700 18px var(--f-score)}
.assign{display:flex;flex-direction:column}
.arow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .nm{flex:1;min-width:0;font-weight:600}
.arow .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.ab{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ab button{border:0;background:var(--bg);width:46px;height:38px;font:700 18px var(--f-score)}
.ab button+button{border-left:1px solid var(--line)}
.ab button.on{background:var(--pitch);color:var(--pitch-ink)}
.card.list{padding:4px 14px;gap:0}
.mrow{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow:focus-visible{outline:2px solid var(--pitch)}
.mrow .nm{flex:1;min-width:0;font-weight:600}
.mrow .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center}
.tile b{font:700 26px/1 var(--f-score);font-variant-numeric:tabular-nums}
.tile span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.prof{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phone{font-variant-numeric:tabular-nums;font-weight:600;user-select:all}
.check{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink)}
.check input{width:20px;height:20px}
.link.inline{padding:0 4px;font-size:inherit}
td.rk{color:var(--muted);width:24px;padding-left:0}
th:first-child+th,td.rk+td{text-align:left;white-space:normal}
td.rk+td{min-width:110px}
td.rk{min-width:0}
.card.row{flex-direction:row;align-items:center;justify-content:space-between}
.card.row span{min-width:0}
.ovrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ovrow input{width:84px;flex:none}
.ovrow .ch.num{min-width:44px;padding:8px 10px;font-size:18px}
.capbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;width:40px;height:38px;font:700 16px var(--f-score);color:var(--muted)}
.capbtn.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.tcount i{font-style:normal;color:var(--ball)}
.av{width:38px;height:38px;border-radius:50%;flex:none;object-fit:cover;display:inline-grid;place-items:center;background:var(--chip);color:var(--pitch);font:700 15px var(--f-score);letter-spacing:.02em}
.av.big{width:64px;height:64px;font-size:24px}
.av.huge{width:96px;height:96px;font-size:34px}
.photorow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.photorow .btn{padding:9px 14px;font-size:14px;color:var(--ink);cursor:pointer}
.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.mom{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--gold);border-radius:16px;padding:12px 14px}
.momtx{display:flex;flex-direction:column;gap:2px;min-width:0}
.momtx b{font:700 24px/1.1 var(--f-score)}
.cmh{font:700 22px var(--f-score)}
.report .rlead{margin:6px 0 8px;line-height:1.5;font-weight:600}
.report .rsec{margin:14px 0 4px;font:700 17px var(--f-score);color:var(--pitch);letter-spacing:.2px}
.report .rlist{margin:0;padding-left:18px;line-height:1.5}
.report .rlist li{margin:3px 0}
.report .rlist li::marker{color:var(--gold)}
.report .rtab{margin-top:12px}
.mvpt td,.mvpt th{text-align:center;padding-left:4px;padding-right:4px}
.mvpt td:first-child{min-width:0;width:20px;color:var(--muted)}
.mvpt td:nth-child(2),.mvpt th:nth-child(2){text-align:left;white-space:normal;width:100%}
.mvpt .dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle}
.report .rtab td,.report .rtab th{text-align:center}
.report .rtab td:first-child,.report .rtab th:first-child{text-align:left}
.cmt{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cbody{min-width:0;flex:1}
.cmeta{font-size:13px;color:var(--muted)}
.cmeta b{color:var(--ink)}
.cbody p{margin:4px 0 0;overflow-wrap:anywhere}
.install{border-color:var(--pitch)}
.shareic{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 5px;font-size:13px}
.pdfbar{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom, 0px));max-width:488px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:5}
.pdfbar span{flex:1;font-weight:600}
.tabs{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.ppb{margin-top:8px;font:600 14px var(--f-body);color:var(--board-dim)}
.ppb.on{color:var(--gold-ink);background:var(--gold);border-radius:8px;padding:5px 9px;align-self:flex-start;position:relative;z-index:1}
.modal{position:fixed;inset:0;background:rgba(4,10,24,.58);display:grid;place-items:center;padding:24px 16px;z-index:20}
.mbox{background:var(--surface);color:var(--ink);border-radius:18px;padding:20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:10px;border-top:6px solid var(--gold)}
.mbox h2{font:700 28px/1.1 var(--f-score)}
.mbox p{margin:0;color:var(--muted)}
.csum table td:first-child{min-width:0;color:var(--muted)}
.csum th:first-child{width:40%}
.rtab td:first-child{white-space:normal;min-width:0}
.rtab td{vertical-align:top}
.t1c{color:var(--t1)} .t2c{color:var(--t2)}
.chartbox{overflow-x:auto;margin:0 -4px;padding:0 4px}
svg.chart{display:block}
svg.chart.wide{width:100%;height:auto}
svg.chart .grid{stroke:var(--line);stroke-dasharray:3 3}
svg.chart .base{stroke:var(--muted);stroke-width:1}
svg.chart .axis{fill:var(--muted);font:500 10px var(--f-body)}
svg.chart .ppzone{fill:var(--chip);opacity:.8}
svg.chart .bar.t1,svg.chart .wk.t1{fill:var(--t1)}
svg.chart .bar.t2,svg.chart .wk.t2{fill:var(--t2)}
svg.chart .wk{stroke:var(--surface);stroke-width:1}
svg.chart .avg{stroke-dasharray:5 4;stroke-width:1.4}
svg.chart .avg.t1,svg.chart .line.t1{stroke:var(--t1)}

<script id="engine">
/* Scoring engine: every match is a list of events per innings; all figures are derived by replaying them. */
var CE = (function(){
  var CREDIT = {'Bowled':1,'Caught':1,'LBW':1,'Stumped':1,'Hit wicket':1,'Run out':0};
  function ov(l){ return l % 6 ? Math.floor(l/6) + '.' + (l % 6) : String(l/6); }

      case 'LBW': return 'lbw b ' + bowler;
      case 'Stumped': return 'st ' + (f ? f + ' ' : '') + 'b ' + bowler;
      case 'Hit wicket': return 'hit wicket b ' + bowler;
      case 'Run out': return 'run out' + (f ? ' (' + f + ')' : '');
      default: return w.how || 'out';
    }
  }
  function label(e){

    if (x === 'wd') return {t:(xr ? (1 + xr) : '') + 'wd', c:'x'};
    if (x === 'nb') return {t:'nb' + (r ? r : ''), c:'x'};
    if (x === 'b') return {t:xr + 'b', c:'x'};
    if (x === 'lb') return {t:xr + 'lb', c:'x'};
    return {t: r ? String(r) : '•', c: r === 4 ? 'b4' : r === 6 ? 'b6' : ''};
  }
  function replay(m, idx){
    var inn = m.innings[idx];
    var squad = m.teams[inn.bat].players;
    var st = {striker:null, non:null, bowler:null, prevBowler:null, legal:0, total:0, wkts:0,
      ext:{wd:0, nb:0, b:0, lb:0}, bat:{}, bowl:{}, field:{}, batOrder:[], bowlOrder:[], fow:[], over:[], overs:[],
      needBowler:true, overRuns:0, part:{r:0, b:0}, closed:false, opened:false, ol:[], parts:[], ppRuns:null};

  }
  function result(m){
    if (m.innings.length < 2) return null;

  /* MVP points (club rules)

     Bowling:  10 per wicket, +5 per maiden; +10 for 3 wickets, or +15 for 5 wickets (instead of the 3-wicket bonus)
     Fielding: 8 per catch, 6 per stumping, 12 per direct-hit run out */
  var PTS = {run:1, four:2, six:4, duck:-1, fifty:15, hundred:40, wkt:10, maiden:5, w3:10, w5:15, catch:8, stump:6, direct:12,
             eco4:4, eco6:2, eco10:-4, eco20:-10, ecoMinBalls:6,
             thirty:5, sr130:4, sr150:6, sr180:8, sr220:10, srMinBalls:5};
  /* Club match rules. Powerplay and bowler limit scale with match length: 25 overs -> 8-over powerplay, 5 overs per bowler */
  var RULES = {ppOut:3, out:5};
  function rules(m){
    var ov = m.overs || 25;

    var e = b.r / (b.balls / 6);

  function batPoints(b){ return b.r * PTS.run + b.f * PTS.four + b.s * PTS.six + (b.out && b.r === 0 ? PTS.duck : 0) + (b.r >= 100 ? PTS.hundred : b.r >= 50 ? PTS.fifty : b.r >= 30 ? PTS.thirty : 0) + srPoints(b); }

    if (b.b < PTS.srMinBalls) return 0;
    var s = b.r * 100 / b.b;

  }
  function bowlPoints(b){ return b.w * PTS.wkt + b.m * PTS.maiden + (b.w >= 5 ? PTS.w5 : b.w >= 3 ? PTS.w3 : 0) + econPoints(b); }

      st.bowlOrder.forEach(function(n){ add(n, 'bowl', bowlPoints(st.bowl[n])); });

  /* Man of the Match: most points; ties go to the winning side, then more runs + wickets */

    if (b.total === a.total) return -1;

  }
  function stats(list){
    var P = {};
    function G(k, n){ return P[k] || (P[k] = {key:k, name:n, m:0, inn:0, r:0, b:0, f:0, s:0, no:0, hs:-1, hsNo:false, fifty:0, hund:0, ducks:0,
      thirty:0, wonM:0, mDone:0, bm:0, binn:0, balls:0, rc:0, w:0, md:0, wd:0, nb:0, bw:-1, br:0, mw:-1, mr:0, w4:0, w5:0, capM:0, capW:0, capL:0, capT:0, capR:0, capWk:0, capB:0, c:0, st:0, ro:0, dh:0, pts:0, pom:0}); }
    list.forEach(function(m){
      var mp = matchPoints(m), key = mp.key, seen = {}, bm = {}, mt = {};
      var MT = function(k){ return mt[k] || (mt[k] = {r:0, b:0, w:0}); };
      m.teams.forEach(function(t){ t.players.forEach(function(n){ var k = key(n); if (!seen[k]) { seen[k] = 1; G(k, n).m++; } }); });
      for (var i = 0; i < m.innings.length; i++) {

/* ---------- helpers ---------- */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(p){ return (p || 'm') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function lsGet(k){ try { return localStorage.getItem('cs-' + k) || ''; } catch(e){ return ''; } }
function lsSet(k, v){ try { localStorage.setItem('cs-' + k, v); } catch(e){} }
function fmtDate(t, wd){ try { return new Date(t).toLocaleDateString(undefined, wd ? {weekday:'short', day:'numeric', month:'short', year:'numeric'} : {day:'numeric', month:'short', year:'numeric'}); } catch(e){ return ''; } }
function dayKey(t){ var d = new Date(t); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function rate(r, balls){ return balls ? (r / (balls / 6)).toFixed(2) : '0.00'; }
function sr(r, b){ return b ? (r * 100 / b).toFixed(1) : '–'; }
function plural(n, w){ return n + ' ' + (n === 1 || /s$/.test(w) ? w : /(ch|x)$/.test(w) ? w + 'es' : w + 's'); }
function toast(msg){ var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function(){ t.hidden = true; }, 2800); }
function listMatches(){ return Object.keys(matches).map(function(k){ return matches[k]; }).filter(function(m){ return !m.deleted; }); }
function listPlayers(){ return Object.keys(players).map(function(k){ return players[k]; }).sort(function(a, b){ return a.name.localeCompare(b.name); }); }
function playerByName(n){ var l = n.toLowerCase(); for (var k in players) if (players[k].name.toLowerCase() === l) return players[k]; return null; }
function okPhoto(s){ return typeof s === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(s) ? s : ''; }
function avatar(key, name, cls){
  var p = (key && players[key]) || (name ? playerByName(name) : null), nm = (p && p.name) || name || '?', ph = p && okPhoto(p.photo);
  if (ph) return '<img class="av ' + (cls || '') + '" src="' + ph + '" alt="">';
  var ini = nm.replace(/[^\p{L}\s]/gu, '').split(/\s+/).filter(Boolean).map(function(w){ return w[0]; }).join('').slice(0, 2).toUpperCase() || '?';
  return '<span class="av ' + (cls || '') + '" aria-hidden="true">' + esc(ini) + '</span>';
}
function photoRow(ph, name){
  return (ph ? '<img class="av big" src="' + ph + '" alt="">' : avatar(null, name || '?', 'big')) +
    '<label class="btn" for="mphoto">' + (ph ? 'Change photo' : 'Add photo') + '</label>' + (ph ? '<button type="button" class="btn" data-act="rmphoto">Remove</button>' : '');
}
function resizePhoto(file, cb){
  var r = new FileReader();
  r.onload = function(){
    var img = new Image();
    img.onload = function(){
      try {
        var S = 320, c = document.createElement('canvas'), s = Math.min(img.width, img.height);
        c.width = S; c.height = S;
        c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, S, S);
        cb(c.toDataURL('image/jpeg', 0.78));
      } catch(e){ cb(null); }
    };
    img.onerror = function(){ cb(null); };
    img.src = r.result;
  };
  r.onerror = function(){ cb(null); };
  r.readAsDataURL(file);
}
function plink(key, name, inner){
  var html = inner || esc(name);
  return key && players[key] ? '<button class="plink" data-act="profile" data-id="' + esc(key) + '">' + html + '</button>' : html;
}
function mkey(m, n){ return m.pids && m.pids[n]; }
function ageOf(dob){
  if (!dob || !/^\d{4}-\d{2}-\d{2}$/.test(dob)) return null;
  var b = new Date(dob + 'T00:00:00'), t = new Date(), a = t.getFullYear() - b.getFullYear();
  if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
  return a >= 0 && a < 120 ? a : null;
}
function displayName(key, fallback){ return (players[key] && players[key].name) || fallback; }
var wakeLock = null, wantAwake = false;
function keepAwake(on){
  on = !!on;
  try { if (NATIVE) { NATIVE.keepAwake(on); return; } } catch(e){}
  wantAwake = on;
  try {
    if (on && !wakeLock && navigator.wakeLock) navigator.wakeLock.request('screen').then(function(l){ wakeLock = l; l.addEventListener('release', function(){ wakeLock = null; }); }, function(){});
    else if (!on && wakeLock) { wakeLock.release(); wakeLock = null; }
  } catch(e){}
}
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && wantAwake) keepAwake(true); });
function shareText(title, text){
  if (NATIVE) { NATIVE.shareText(title, text); return; }
  if (navigator.share) { navigator.share({title:title, text:text}).catch(function(){}); return; }
  try { navigator.clipboard.writeText(text).then(function(){ toast('Copied. Paste it in your group.'); }, function(){ toast('Could not copy'); }); } catch(e){ toast('Could not copy'); }
}

/* ---------- Firebase ---------- */
function boot(){
  if (!configured) { render(); return; }
  try {
    firebase.initializeApp(CFG);
    db = firebase.firestore();
    db.enablePersistence({synchronizeTabs:false}).catch(function(){});
    auth = firebase.auth();
  } catch(e){ view = 'setup'; ui.setupErr = 'Firebase could not start: ' + (e.message || e); render(); return; }
  auth.onAuthStateChanged(function(u){
    if (!u) { view = 'join'; render(); return; }
    me.uid = u.uid; me.name = lsGet('name');
    if (lsGet('joined') === u.uid) { start(); return; }
    db.collection('members_auth').doc(u.uid).get().then(function(d){
      if (d.exists) { lsSet('joined', u.uid); if (!me.name) { me.name = d.data().name || ''; lsSet('name', me.name); } start(); }
      else { view = 'join'; render(); }
    }, function(){ view = 'join'; render(); });
  });
  render();
}
function join(code, name){
  ui.joinErr = ''; ui.joining = true; render();
  var p = auth.currentUser ? Promise.resolve() : auth.signInAnonymously();
  p.then(function(){
    var u = auth.currentUser.uid;
    return db.collection('members_auth').doc(u).set({code:code, name:name, joined:Date.now()}).then(function(){
      lsSet('joined', u); lsSet('name', name); me = {uid:u, name:name}; ui.joining = false; start();
    });
  }).catch(function(e){
    ui.joining = false;
    var c = e && e.code;
    ui.joinErr = c === 'permission-denied' ? 'That club code is not right. Ask your club admin for it.'
      : c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation' ? 'Anonymous sign-in is turned off in Firebase. Turn it on under Authentication → Sign-in method.'
      : 'Could not join. Check your internet connection and try again.';
    render();
  });
}
function start(){
  if (view === 'join' || view === 'loading') view = 'home';
  unsubs.forEach(function(f){ f(); }); unsubs = [];
  unsubs.push(db.collection('players').onSnapshot(function(s){
    players = {}; s.forEach(function(d){ var o = d.data(); o.id = d.id; players[d.id] = o; });
    loaded.p = true; refresh();
  }, dbError));
  unsubs.push(db.collection('config').doc('app').onSnapshot(function(d){
    cfg.minVersion = d.exists ? (+d.data().minVersion || 0) : 0;
    if (cfg.minVersion > APP_BUILD) { view = 'update'; render(); } else if (view === 'update') go('home');
  }, function(){}));
  unsubs.push(db.collection('matches').onSnapshot(function(s){
    s.docChanges().forEach(function(ch){
      var id = ch.doc.id;
      if (ch.type === 'removed') { delete matches[id]; return; }
      var r = ch.doc.data(), l = matches[id];
      if (l && ch.doc.metadata.hasPendingWrites) return;
      if (!l || (r.rev || 0) >= (l.rev || 0)) matches[id] = clone(r);
    });
    loaded.m = true; refresh();
  }, dbError));
  render();
}
function dbError(e){
  if (e && e.code === 'permission-denied') { lsSet('joined', ''); view = 'join'; ui.joinErr = 'This phone is not linked to the club any more. Enter the club code again.'; render(); }
  else toast('Connection problem. Scores stay on this phone and sync later.');
}
function refresh(){ if (view === 'new' || view === 'editMember' || view === 'join' || view === 'setup') return; render(); }
function saveMatch(m){
  m.rev = (m.rev || 0) + 1; m.updated = Date.now(); m.appv = APP_BUILD; matches[m.id] = m;
  db.collection('matches').doc(m.id).set(clone(m)).catch(function(e){
    if (e && e.code === 'permission-denied') {
      toast('Not saved: this match is locked, or this change needs the admin login.');
      db.collection('matches').doc(m.id).get().then(function(d){ if (d.exists) { matches[m.id] = clone(d.data()); render(); } }, function(){});
    } else toast('Could not save this ball. Check your connection.');
  });
}

function autoSplit(){
  var ids = Object.keys(draft.team).filter(function(k){ return draft.team[k]; });
  var order = ['Wicket-keeper', 'Bowler', 'All-rounder', 'Batter'];
  var groups = order.map(function(r){ return ids.filter(function(id){ return (players[id] && players[id].role || 'All-rounder') === r; }); });
  var rest = ids.filter(function(id){ return order.indexOf(players[id] && players[id].role) < 0; });
  groups[2] = groups[2].concat(rest);
  var a = 0, b = 0;
  groups.forEach(function(g){
    for (var i = g.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = g[i]; g[i] = g[j]; g[j] = t; }
    g.forEach(function(id){ var to = a < b ? 'A' : b < a ? 'B' : (Math.random() < .5 ? 'A' : 'B'); draft.team[id] = to; if (to === 'A') a++; else b++; });
  });
}

function scoreboard(m, idx, st){

  var R = CE.rules(m);
  if (!st.done && R.pp > 0) h += st.legal < R.pp * 6
    ? '<div class="ppb on">⚡ Powerplay · overs 1–' + R.pp + ' · max ' + R.ppOut + ' fielders outside the circle</div>'
    : '<div class="ppb">Powerplay over · max ' + R.out + ' fielders outside the circle</div>';
  if (st.target != null) {
    var need = Math.max(0, st.target - st.total), bl = st.maxBalls - st.legal;
    h += '<div class="target">Target ' + st.target + ' · ' + (need > 0 ? 'Need ' + need + ' from ' + plural(bl, 'ball') + (bl > 0 ? ' · Req. ' + rate(need, bl) : '') : 'Target reached') + '</div>';
  }
  return h + '</section>';
}

      '<span class="sub">4s ' + b.f + ' · 6s ' + b.s + ' · SR ' + sr(b.r, b.b) + '</span></div>';
  });
  if (st.striker != null && st.non != null) h += '<div class="small">Partnership ' + st.part.r + ' (' + st.part.b + ')</div>';
  var bn = st.bowler || st.prevBowler;

}

      ['Best', 'bbi', function(r){ return r.bw < 0 ? '–' : r.bw + '/' + r.br; }], ['Econ', 'eco', function(r){ return rate(r.rc, r.balls); }],
      ['Avg', 'bavg', function(r){ return r.w ? (r.rc / r.w).toFixed(1) : '–'; }], ['M', 'md', function(r){ return r.md; }],
      ['NB', 'nb', function(r){ return r.nb; }], ['WD', 'wd', function(r){ return r.wd; }]],
    sorts:[['w', 'Most wickets'], ['eco', 'Best economy (2+ overs)'], ['bavg', 'Best average'], ['bbi', 'Best bowling'], ['md', 'Most maidens'], ['wd', 'Most wides'], ['nb', 'Most no balls']]},
  field: {who:'Fielder', base:function(r){ return r.c + r.st + r.ro > 0; },
    cols:[['Total', 'tot', function(r){ return r.c + r.st + r.ro; }], ['Ct', 'c', function(r){ return r.c; }], ['St', 'st', function(r){ return r.st; }],
      ['RO', 'ro', function(r){ return r.ro; }], ['Direct', 'dh', function(r){ return r.dh; }]],
    sorts:[['tot', 'Most dismissals'], ['c', 'Most catches'], ['st', 'Most stumpings'], ['ro', 'Most run outs'], ['dh', 'Most direct hits']]},
  cap: {who:'Captain', base:function(r){ return r.capM > 0; },
    cols:[['M', 'capM', function(r){ return r.capM; }], ['Won', 'capW', function(r){ return r.capW; }], ['Lost', 'capL', function(r){ return r.capL; }],
      ['Tied', 'capT', function(r){ return r.capT; }], ['Win %', 'pct', function(r){ return Math.round(r.capW * 100 / r.capM) + '%'; }],
      ['Runs', 'capR', function(r){ return r.capR; }], ['Wkts', 'capWk', function(r){ return r.capWk; }]],
    sorts:[['capW', 'Most wins'], ['pct', 'Best win %'], ['capM', 'Most matches as captain'], ['capR', 'Most runs as captain'], ['capWk', 'Most wickets as captain']]}
};
/* value used for sorting (bigger is better unless listed in ASC) */
var SORT_ASC = {eco:1, bavg:1, avg_dummy:1};
function sortVal(k, r){
  switch (k) {
    case 'avg': var o = r.inn - r.no; return o ? r.r / o : (r.r ? r.r : -1);
    case 'sr': return r.b >= 20 ? r.r * 100 / r.b : -1;
    case 'hs': return r.hs + (r.hsNo ? 0.5 : 0);
    case 'eco': return r.balls >= 12 ? r.rc / (r.balls / 6) : 1e9;
    case 'bavg': return r.w ? r.rc / r.w : 1e9;
    case 'bbi': return r.bw < 0 ? -1 : r.bw * 1000 - r.br;
    case 'tot': return r.c + r.st + r.ro;
    case 'pct': return r.capM ? r.capW / r.capM : 0;
    default: return r[k] || 0;
  }
}
function sortedRows(mode, rows, key){
  var D = STAT_DEFS[mode], asc = !!SORT_ASC[key];
  var list = rows.filter(D.base);
  if (key === 'sr') list = list.filter(function(r){ return r.b >= 20; });
  if (key === 'eco') list = list.filter(function(r){ return r.balls >= 12; });
  if (key === 'bavg') list = list.filter(function(r){ return r.w > 0; });
  return list.sort(function(a, b){ var x = sortVal(key, a), y = sortVal(key, b); return (asc ? x - y : y - x) || a.name.localeCompare(b.name); });
}
function statsView(){
  var seasons = seasonList(), s = statsFor(ui.season);
  var h = header('Season stats');
  h += '<div class="chips">' + ['all'].concat(seasons).map(function(y){ return '<button class="ch' + (String(ui.season) === String(y) ? ' on' : '') + '" data-act="season" data-v="' + y + '">' + (y === 'all' ? 'All time' : y) + '</button>'; }).join('') + '</div>';
  var modes = [['mvp', 'MVP'], ['bat', 'Batting'], ['bowl', 'Bowling'], ['field', 'Fielding'], ['cap', 'Captains']];
  h += '<div class="seg2">' + modes.map(function(md){ return '<button class="' + (ui.statsMode === md[0] ? 'on' : '') + '" data-act="smode" data-v="' + md[0] + '">' + md[1] + '</button>'; }).join('') + '</div>';
  if (!s.count) return h + '<div class="empty"><b>No matches yet</b>Rankings fill in from every completed and live match.</div>';
  var mode = STAT_DEFS[ui.statsMode] ? ui.statsMode : 'mvp', D = STAT_DEFS[mode];
  ui.sort = ui.sort || {};
  var key = ui.sort[mode] || D.sorts[0][0];
  h += '<div class="sortrow"><label for="sortsel" class="flabel">Sort by</label><select id="sortsel">' + D.sorts.map(function(o){ return '<option value="' + o[0] + '"' + (o[0] === key ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>';
  var rows = sortedRows(mode, s.rows, key), hl = function(k){ return k === key ? ' class="sorted"' : ''; };
  var cols = D.cols.slice(), ci = cols.findIndex(function(c){ return c[1] === key; });
  if (ci > 0) cols.unshift(cols.splice(ci, 1)[0]);
  var t = '<section class="card"><div class="tw"><table class="stbl"><thead><tr><th>#</th><th>' + D.who + '</th>' + cols.map(function(c){ return '<th' + hl(c[1]) + '>' + c[0] + '</th>'; }).join('') + '</tr></thead><tbody>';
  t += rows.map(function(r, i){
    return '<tr><td class="rk">' + (i + 1) + '</td><td><span class="sname">' + avatar(r.key, r.name, 'xs') + '<b>' + plink(r.key, r.name) + '</b></span></td>' +
      cols.map(function(c){ return '<td' + hl(c[1]) + '>' + c[2](r) + '</td>'; }).join('') + '</tr>';
  }).join('');
  if (!rows.length) t += '<tr><td colspan="13" class="small">Nothing recorded yet' + (key === 'sr' ? ' (needs 20+ balls faced)' : key === 'eco' ? ' (needs 2+ overs)' : '') + '.</td></tr>';
  t += '</tbody></table></div></section>';
  h += t + '<p class="small">From ' + plural(s.count, 'match') + (ui.season === 'all' ? '' : ' in ' + ui.season) + '. Tap a name to open the player. ' +
    (mode === 'mvp' ? 'See the Rules tab for how MVP points are worked out.' : mode === 'cap' ? 'Completed matches where the player was captain; runs and wickets are his own in those matches.' : mode === 'bat' ? '* = not out.' : '') + '</p>';
  h += '<div class="actions"><button class="btn primary" data-act="statspdf">Share stats PDF</button><button class="btn" data-act="shareseason">Share as text</button></div>';
  return h;
}

function scorecardText(m){
  var capLine = m.teams.filter(function(t){ return t.captain; }).map(function(t){ return t.name + ' captain: ' + t.captain; }).join(' · ');
  var lines = [m.teams[0].name + ' vs ' + m.teams[1].name + (capLine ? '\n' + capLine : ''), fmtDate(m.date, true) + (m.venue ? ' · ' + m.venue : '') + ' · ' + m.overs + (m.overs === 1 ? ' over' : ' overs'), ''];
  m.innings.forEach(function(inn, i){
    var st = CE.replay(m, i), t = m.teams[inn.bat];
    lines.push('*' + t.name + ' ' + st.total + '/' + st.wkts + '* (' + CE.ov(st.legal) + ' ov)');
    st.batOrder.forEach(function(n){ var b = st.bat[n]; lines.push(n + (t.captain === n ? ' (c)' : '') + ' ' + b.r + (b.out ? '' : '*') + ' (' + b.b + ')' + (b.out ? ' – ' + b.out : b.retired ? ' – retired not out' : '')); });
    lines.push('Extras ' + st.extTotal);
    var bw = st.bowlOrder.map(function(n){ var w = st.bowl[n]; return n + ' ' + w.w + '/' + w.r + ' (' + CE.ov(w.balls) + ')'; });
    if (bw.length) lines.push('Bowling: ' + bw.join(', '));
    lines.push('');
  });
  lines.push('*' + (m.result || liveStatus(m)) + '*');
  var pom = CE.playerOfMatch(m); if (pom) lines.push('Man of the Match: ' + displayName(pom.key, pom.name) + ' (' + pom.pts + ' pts)');
  return lines.join('\n');
}
function dayText(k){
  var list = listMatches().filter(function(m){ return dayKey(m.date) === k; }).sort(function(a, b){ return a.date - b.date; });
  if (!list.length) return '';
  var lines = ['*🏏 Cricket – ' + fmtDate(list[0].date, true) + '*', ''];
  list.forEach(function(m, n){
    lines.push('*Match ' + (n + 1) + ':* ' + m.innings.map(function(inn, i){ var st = CE.replay(m, i); return m.teams[inn.bat].name + ' ' + st.total + '/' + st.wkts + ' (' + CE.ov(st.legal) + ')'; }).join(' vs '));
    lines.push(m.status === 'done' ? (m.result || '') : 'In progress: ' + liveStatus(m));
    var pom = CE.playerOfMatch(m); if (pom) lines.push('Man of the Match: ' + displayName(pom.key, pom.name));
    lines.push('');
  });
  var rows = CE.stats(list).map(function(r){ r.name = displayName(r.key, r.name); return r; });
  var top = function(f, n, fmt){ return rows.filter(function(r){ return r[f] > 0; }).sort(function(a, b){ return b[f] - a[f]; }).slice(0, n).map(fmt).join(', '); };
  var tr = top('r', 3, function(r){ return r.name + ' ' + r.r; }), tw = top('w', 3, function(r){ return r.name + ' ' + r.w; });
  if (tr) lines.push('Top runs: ' + tr);
  if (tw) lines.push('Top wickets: ' + tw);
  return lines.join('\n');
}
function seasonText(){
  var s = statsFor(ui.season), label = ui.season === 'all' ? 'All time' : 'Season ' + ui.season;
  var top = function(sorter, filter, fmt){ return s.rows.filter(filter).sort(sorter).slice(0, 5).map(function(r, i){ return (i + 1) + '. ' + fmt(r); }).join('\n'); };
  return ['*🏏 ' + label + ' leaderboard* (' + plural(s.count, 'match') + ')', '',
    '*MVP*', top(function(a, b){ return b.pts - a.pts; }, function(r){ return r.pts > 0; }, function(r){ return r.name + ' – ' + r.pts + ' pts'; }), '',
    '*Most runs*', top(function(a, b){ return b.r - a.r; }, function(r){ return r.r > 0; }, function(r){ return r.name + ' – ' + r.r; }), '',
    '*Most wickets*', top(function(a, b){ return b.w - a.w; }, function(r){ return r.w > 0; }, function(r){ return r.name + ' – ' + r.w; })].join('\n');
}

var lastLegal = {};
function checkPowerplay(){
  var m = view === 'match' ? matches[curId] : null;

  var idx = m.innings.length - 1, st = CE.replay(m, idx), R = CE.rules(m), key = m.id + ':' + idx, prev = lastLegal[key];
  lastLegal[key] = st.legal;
  if (prev == null || R.pp <= 0 || R.pp >= m.overs || st.done) return;
  if (prev < R.pp * 6 && st.legal >= R.pp * 6) {
    $('#pptext').textContent = R.pp + ' overs done (' + m.teams[m.innings[idx].bat].name + ' ' + st.total + '/' + st.wkts + '). From now on up to ' + R.out + ' fielders can field outside the 30-yard circle.';

function teamUsage(m){
  var u = {}, idx = m.innings.length - 1, cur = CE.replay(m, idx);
  var mark = function(n, what){ (u[n] || (u[n] = {})) [what] = true; };
  m.innings.forEach(function(_, i){
    var st = i === idx ? cur : CE.replay(m, i);
    st.batOrder.forEach(function(n){ mark(n, 'bat'); });
    st.bowlOrder.forEach(function(n){ mark(n, 'bowl'); });
    Object.keys(st.field).forEach(function(n){ mark(n, 'field'); });
  });
  if (m.status !== 'done') { if (cur.striker) mark(cur.striker, 'crease'); if (cur.non) mark(cur.non, 'crease'); if (cur.bowler && cur.over.length) mark(cur.bowler, 'overNow'); }

}

      return;
    case 'shareday': shareText('Cricket results', dayText(d.v)); return;
    case 'daypdf': dayPdf(d.v); return;
    case 'sharepdf': matchPdf(m); return;
    case 'sharereport': var mr = matchReport(m); if (mr) shareText(m.teams[0].name + ' vs ' + m.teams[1].name, reportText(mr, m.teams[0].name + ' vs ' + m.teams[1].name + ' (' + fmtDate(m.date) + ')' + (m.result ? '\n' + m.result : ''))); return;
    case 'sharepreport': var pr2 = playerReport(profileId); if (pr2) shareText(players[profileId].name, reportText(pr2, players[profileId].name)); return;
    case 'shareseason': shareText('Cricket leaderboard', seasonText()); return;
    case 'share': shareText(m.teams[0].name + ' vs ' + m.teams[1].name, scorecardText(m)); return;
    /* new match */
    case 'pick': if (draft.team[d.id]) { delete draft.team[d.id]; fixCaps(); } else draft.team[d.id] = teamCount('A') <= teamCount('B') ? 'A' : 'B'; render(); return;
    case 'assign': draft.team[d.id] = d.v; fixCaps(); render(); return;
    case 'cap': var ct = draft.team[d.id]; if (ct) { draft.cap[ct] = draft.cap[ct] === d.id ? '' : d.id; } render(); return;
    case 'setov': draft.overs = +d.v; draft.pp = Math.round(draft.overs * 8 / 25); draft.maxBowl = Math.ceil(draft.overs / 5); render(); return;
    case 'retire': ui.retire = {who:st.striker}; render(); return;
    case 'retwho': ui.retire.who = d.v; render(); return;
    case 'retok': var rwho = ui.retire.who; ui.retire = null; addEvent({t:'retire', who:rwho}); toast(rwho + ' retired not out'); return;
    case 'chov': ui.chov = true; ui.mode = null; ui.wk = null; render(); return;
    case 'chovset': $('#chov').value = d.v; return;
    case 'chovok':
      var nov = parseInt($('#chov').value, 10);
      if (!nov || nov < +d.min || nov > 50) { toast('Enter overs between ' + d.min + ' and 50'); return; }
      var oldR = CE.rules(m); m.overs = nov; m.maxBowl = Math.ceil(nov / 5); m.pp = Math.min(oldR.pp, nov);
      ui.chov = false; afterChange(m); toast('Now ' + nov + ' overs per side · max ' + m.maxBowl + ' overs per bowler'); return;
    case 'autosplit': autoSplit(); fixCaps(); render(); toast('Teams split. Adjust with A / B if needed.'); return;
    case 'addnew':
      var inp = $('#dnew'), nn = inp ? inp.value.trim().replace(/\s+/g, ' ') : '';
      if (!nn) { toast('Type a name first'); return; }
      var ex = playerByName(nn) || newPlayer(nn);
      if (ex.active === false) { ex.active = true; savePlayer(ex); }
      draft.team[ex.id] = teamCount('A') <= teamCount('B') ? 'A' : 'B'; render(); return;
    /* members */
    case 'addmember': editId = null; go('editMember'); return;
    case 'editmember': editId = profileId; go('editMember'); return;
    case 'profile': if (!players[d.id]) return; profileFrom = (view === 'match' || view === 'stats') ? {view:view, tab:tab, curId:curId} : profileFrom && view === 'profile' ? profileFrom : null; profileId = d.id; go('profile'); return;
    case 'copyphone': shareText('Phone', players[profileId].phone); return;
    case 'rename': ui.renaming = true; render(); return;
    case 'renameok': var mn = $('#myname').value.trim(); if (mn) { me.name = mn; lsSet('name', mn); } ui.renaming = false; render(); return;
    /* scoring */
    case 'claim': m.scorer = {uid:me.uid, name:me.name || 'A member', at:Date.now()}; saveMatch(m); render(); return;
    case 'release': m.scorer = null; saveMatch(m); render(); return;
    case 'run': addEvent({t:'ball', r:+d.v}); return;
    case 'mode': ui.mode = d.v; render(); return;
    case 'ext':
      var n = +d.v;
      if (ui.mode === 'wd') addEvent({t:'ball', x:'wd', xr:n});
      else if (ui.mode === 'nb') addEvent({t:'ball', x:'nb', r:n});
      else addEvent({t:'ball', x:ui.mode, xr:n});
      return;
    case 'swap': addEvent({t:'swap'}); return;
    case 'undo':
      var inn = m.innings[idx];
      if (inn.events.length) inn.events.pop(); else if (m.innings.length > 1) m.innings.pop(); else { toast('Nothing to undo'); return; }
      afterChange(m); toast('Last entry undone'); return;
    case 'wk': ui.wk = {how:'Bowled', out:st.striker, f:'', runs:0, x:''}; render(); return;
    case 'wkhow': ui.wk.how = d.v; if (d.v !== 'Run out') { ui.wk.out = st.striker; ui.wk.runs = 0; } if (d.v !== 'Run out' && d.v !== 'Stumped') ui.wk.x = ''; if (d.v === 'Stumped' && ui.wk.x === 'nb') ui.wk.x = ''; render(); return;
    case 'wkout': ui.wk.out = d.v; render(); return;
    case 'wkruns': ui.wk.runs = +d.v; render(); return;
    case 'wkx': ui.wk.x = d.v; render(); return;
    case 'wkf': ui.wk.f = ui.wk.f === d.v ? '' : d.v; render(); return;
    case 'cpost':
      var ct = $('#cmt'), txt = ct ? ct.value.trim() : '';
      if (!txt) { toast('Write something first'); return; }
      db.collection('comments').add({matchId:curId, uid:me.uid, name:me.name || 'Member', text:txt.slice(0, 500), at:Date.now()})
        .catch(function(e){ toast(e && e.code === 'permission-denied' ? 'Comments are not switched on yet. Ask the club admin to update the rules.' : 'Could not post. Check your connection.'); });
      ui.cmtDraft = ''; ct.value = ''; toast('Comment posted'); return;
    case 'cdel': db.collection('comments').doc(d.id).delete().catch(function(){ toast('Could not delete. Check your connection.'); }); return;
    case 'rmphoto': ui.photo = ''; var pr = $('#photorow'); if (pr) pr.innerHTML = photoRow('', $('#mname').value); return;
    case 'wkdh': ui.wk.dh = d.v === '1'; render(); return;
    case 'wkok':
      var w = ui.wk, needF = w.how === 'Caught' || w.how === 'Run out' || w.how === 'Stumped';
      var ev = {t:'ball', w:{how:w.how, out:w.how === 'Run out' ? w.out : st.striker, f:needF ? w.f : ''}};
      if (w.how === 'Run out' && w.dh) ev.w.dh = true;
      if (w.how === 'Run out') { if (w.x === 'wd') { ev.x = 'wd'; ev.xr = w.runs; } else if (w.x === 'nb') { ev.x = 'nb'; ev.r = w.runs; } else ev.r = w.runs; }
      else if (w.how === 'Stumped' && w.x === 'wd') { ev.x = 'wd'; ev.xr = 0; }
      addEvent(ev); return;
    case 'etopen': ui.editTeams = true; ui.mode = null; ui.wk = null; render(); window.scrollTo(0, 0); return;
    case 'etdone': ui.editTeams = false; render(); return;
    case 'etmove':
      var tf = m.teams[+d.t], tt = m.teams[1 - (+d.t)], mi = tf.players.indexOf(d.v);
      if (mi < 0) return;
      if (tf.players.length <= 2) { toast(tf.name + ' needs at least 2 players'); return; }
      tf.players.splice(mi, 1); moveCaptain(tf, d.v); if (tt.players.indexOf(d.v) < 0) tt.players.push(d.v);
      saveMatch(m); render(); toast(d.v + ' moved to ' + tt.name); return;
    case 'etrm':
      var tr = m.teams[+d.t], ri = tr.players.indexOf(d.v);
      if (ri < 0) return;
      if (tr.players.length <= 2) { toast(tr.name + ' needs at least 2 players'); return; }
      tr.players.splice(ri, 1); moveCaptain(tr, d.v); saveMatch(m); render(); toast(d.v + ' removed'); return;
    case 'etadd':
      var pk = $('#etpick'), nw = $('#etnew'), an = ((pk && pk.value) || (nw ? nw.value : '')).trim().replace(/\s+/g, ' ');
      if (!an) { toast('Choose a member or type a name'); return; }
      var kn = playerByName(an); if (kn) an = kn.name;
      if (m.teams.some(function(t){ return t.players.indexOf(an) >= 0; })) { toast(an + ' is already in this match'); return; }
      m.teams[+d.t].players.push(an); linkPlayer(m, an); saveMatch(m); render(); toast(an + ' added to ' + m.teams[+d.t].name); return;
    case 'etswap':
      var sa = $('#etswA').value, sb = $('#etswB').value;
      if (!sa || !sb) { toast('Pick one player from each team'); return; }
      var A = m.teams[0], Bt = m.teams[1];
      A.players[A.players.indexOf(sa)] = sb; Bt.players[Bt.players.indexOf(sb)] = sa; moveCaptain(A, sa); moveCaptain(Bt, sb);
      saveMatch(m); render(); toast(sa + ' and ' + sb + ' swapped'); return;
    case 'cancel': ui.editTeams = false; ui.mode = null; ui.wk = null; ui.confirmDel = false; ui.confirmEnd = false; ui.renaming = false; ui.retire = null; ui.chov = false; ui.confirmPerm = null; render(); return;
    case 'endinn': ui.confirmEnd = true; render(); return;
    case 'endok': addEvent({t:'end'}); return;
    case 'second': m.innings.push({bat:1 - m.innings[0].bat, events:[]}); afterChange(m); window.scrollTo(0, 0); return;
    case 'openinn':
      var s = $('#op-s').value, nn2 = $('#op-n').value, bw = $('#op-b').value;
      if (s === nn2) { toast('Pick two different batters'); return; }
      addEvent({t:'open', s:s, n:nn2, bowl:bw}); return;
    case 'bat': addEvent({t:'in', name:d.v}); return;
    case 'bowl': addEvent({t:'bowl', name:d.v}); return;
    case 'addp':
      var input = $('#addp'), name = input ? input.value.trim().replace(/\s+/g, ' ') : '', team = m.teams[+d.t];
      if (!name) { toast('Type a name first'); return; }
      var known = playerByName(name); if (known) name = known.name;
      if (d.role === 'bat' && st.bat[name]) { toast(name + ' has already batted'); return; }
      if (d.role === 'bowl' && name === st.prevBowler) { toast(name + ' bowled the last over'); return; }
      if (d.role === 'bowl' && st.bowl[name] && Math.floor(st.bowl[name].balls / 6) >= CE.rules(m).maxBowl) { toast(name + ' has bowled the maximum overs'); return; }
      if (team.players.indexOf(name) < 0) team.players.push(name);
      linkPlayer(m, name);
      addEvent(d.role === 'bat' ? {t:'in', name:name} : {t:'bowl', name:name}); return;
    case 'del': askAdmin('Delete match', function(){ ui.confirmDel = true; render(); }); return;
    case 'delok': m.deleted = true; saveMatch(m); curId = null; go('home'); toast('Match deleted'); return;
  }
}

/* phone back button (Android) */
window.handleBack = function(){
  if (!$('#admmodal').hidden) { $('#admmodal').hidden = true; adminPending = null; return true; }
  if (!$('#ppmodal').hidden) { $('#ppmodal').hidden = true; return true; }
  if (ui.wk || ui.mode || ui.confirmEnd || ui.confirmDel || ui.renaming || ui.retire || ui.chov || ui.editTeams) { act('cancel', {}); return true; }
  if (view === 'match' && tab === 'card') { tab = 'score'; render(); return true; }
  if (view === 'editMember') { go(editId ? 'profile' : 'members'); return true; }
  if (view === 'profile') { act('pback', {}); return true; }
  if (view === 'new' || view === 'match' || view === 'members' || view === 'stats' || view === 'rules') { go('home'); return true; }
  return false;
};

$('#ppok').addEventListener('click', function(){ $('#ppmodal').hidden = true; });
$('#admform').addEventListener('submit', function(e){ e.preventDefault(); adminSubmit(); });
$('#admX').addEventListener('click', function(){ $('#admmodal').hidden = true; adminPending = null; });
document.body.addEventListener('click', function(e){ var b = e.target.closest('#admmodal, #ppmodal'); if (b === e.target) { b.hidden = true; adminPending = null; } });
var pg = $('#pdfgo'); if (pg) pg.addEventListener('click', function(){ if (pendingPdf) sharePdfFile(pendingPdf); });
var px = $('#pdfx'); if (px) px.addEventListener('click', hidePdfBar);
boot();
})();
</script>
